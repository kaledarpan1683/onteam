<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnTeam | Enterprise Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.getItem('onteam_theme') === 'dark' || (!localStorage.getItem('onteam_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col justify-between transition-colors">

    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 p-4 px-6 flex justify-between items-center shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="bg-[#a16836] text-white px-3.5 py-1.5 rounded-xl font-bold tracking-tight text-sm shadow-md">⚡ OnTeam ERP</div>
            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium hidden sm:inline border-l border-slate-300 dark:border-slate-800 pl-3">Corporate Authentication Gateway</span>
        </div>
    </header>

    <main class="flex-grow p-6 flex items-center justify-center">
        <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-2xl">
            
            <div id="login-section">
                <div class="text-center mb-6">
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Sign In to Your Workspace</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter your corporate credentials.</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Mail Id</label>
                        <input id="login-email" type="email" placeholder="mail@company.com" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-[#a16836]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Password</label>
                        <div class="relative">
                            <input id="login-password" type="password" placeholder="Password" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-[#a16836] pr-10">
                            <button type="button" onclick="togglePassword('login-password', this)" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs">👁️</button>
                        </div>
                    </div>
                    <button onclick="corporateLogin()" class="w-full py-3 bg-[#a16836] hover:bg-[#84532b] text-white font-semibold rounded-xl transition text-sm shadow-md">Secure Login</button>
                </div>
            </div>

            <div id="workspace-section" class="hidden space-y-6">
                <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-4">
                    <div>
                        <h2 id="ws-name" class="text-lg font-bold text-slate-900 dark:text-white">User Name</h2>
                        <span id="ws-role-badge" class="text-[10px] bg-[#a16836]/10 text-[#a16836] px-2 py-0.5 rounded font-mono">Role</span>
                    </div>
                    <button onclick="location.reload()" class="text-xs text-rose-500 hover:underline font-medium">Sign Out</button>
                </div>
                <div id="ws-content" class="text-xs text-slate-600 dark:text-slate-300 space-y-3"></div>
            </div>

        </div>
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 text-center py-4 text-xs text-slate-500">
        OnTeam Secure Enterprise Gateway &copy; 2026
    </footer>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = '🙈';
            } else {
                input.type = 'password';
                btn.innerText = '👁️';
            }
        }

        async function corporateLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            if (!email || !password) return alert('Please enter mail Id and password.');

            try {
                const res = await fetch('/api/secure/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('workspace-section').classList.remove('hidden');
                    renderUserDashboard(data.user);
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Login connection error.');
            }
        }

        function renderUserDashboard(user) {
            document.getElementById('ws-name').innerText = user.name;
            document.getElementById('ws-role-badge').innerText = `${user.role} • ${user.department}`;
            document.getElementById('ws-content').innerHTML = `
                <div class="p-4 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800 space-y-2">
                    <div class="font-bold text-slate-900 dark:text-white">Workspace Session Active</div>
                    <p class="text-slate-500">Authenticated securely via Supabase database records for department: ${user.department}.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
