<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnTeam | Enterprise Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col justify-between transition-colors">

    <!-- Header -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 p-4 px-6 flex justify-between items-center shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white px-3.5 py-1.5 rounded-xl font-bold tracking-tight text-sm shadow-md shadow-indigo-600/20">⚡ OnTeam ERP</div>
            <span class="text-xs text-slate-500 dark:text-slate-400 font-medium hidden sm:inline border-l border-slate-300 dark:border-slate-800 pl-3">Corporate Authentication Gateway</span>
        </div>
        <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-medium">🌓 Theme</button>
    </header>

    <!-- Main Container -->
    <main class="flex-grow p-6 flex items-center justify-center">
        <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-2xl">
            
            <!-- Login View -->
            <div id="login-section">
                <div class="text-center mb-6">
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Sign In to Your Workspace</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter your corporate email and password.</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Corporate Email</label>
                        <input id="login-email" type="email" placeholder="e.g. admin@apex.com" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Password</label>
                        <input id="login-password" type="password" placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <button onclick="corporateLogin()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition text-sm shadow-md shadow-indigo-600/20">Secure Login</button>
                </div>

                <!-- Trial Demo Accounts Helper for your Testing -->
                <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800 text-center">
                    <p class="text-[11px] text-slate-400 mb-2">Test Accounts (Password: <code class="text-indigo-400">password123</code>):</p>
                    <div class="flex flex-wrap gap-1.5 justify-center">
                        <button onclick="fillDemo('admin@apex.com')" class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-1 rounded">Company Admin</button>
                        <button onclick="fillDemo('dept@apex.com')" class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-1 rounded">Dept Head</button>
                        <button onclick="fillDemo('shift@apex.com')" class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-1 rounded">Shift Head</button>
                        <button onclick="fillDemo('worker@apex.com')" class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-1 rounded">Worker</button>
                    </div>
                </div>
            </div>

            <!-- Authenticated Workspace View (Dynamic based on role) -->
            <div id="workspace-section" class="hidden space-y-6">
                <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-4">
                    <div>
                        <h2 id="ws-name" class="text-lg font-bold text-slate-900 dark:text-white">User Name</h2>
                        <span id="ws-role-badge" class="text-[10px] bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 px-2 py-0.5 rounded font-mono">Role</span>
                    </div>
                    <button onclick="location.reload()" class="text-xs text-rose-500 hover:underline font-medium">Sign Out</button>
                </div>

                <div id="ws-content" class="text-xs text-slate-600 dark:text-slate-300 space-y-3">
                    <!-- Dynamic Dashboard injected here -->
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 text-center py-4 text-xs text-slate-500">
        OnTeam Secure Enterprise Gateway &copy; 2026
    </footer>

    <!-- Logic Script -->
    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        function fillDemo(email) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = 'password123';
        }

        async function corporateLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/secure/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('workspace-section').classList.remove('hidden');
                    renderUserDashboard(data.user);
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Login connection error.');
            }
        }

        function renderUserDashboard(user) {
            document.getElementById('ws-name').innerText = user.name;
            document.getElementById('ws-role-badge').innerText = `${user.role} • ${user.department}`;
            
            const content = document.getElementById('ws-content');

            if (user.role === 'Company-Super-Admin') {
                content.innerHTML = `
                    <div class="p-4 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800 space-y-2">
                        <div class="font-bold text-slate-900 dark:text-white">🏢 Company Management Console</div>
                        <p class="text-slate-500">Manage department heads, audit factory shift performance, and review enterprise-wide throughput metrics.</p>
                        <div class="grid grid-cols-2 gap-2 pt-2">
                            <div class="p-3 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800 text-center">
                                <div class="text-[10px] text-slate-400">Active Units</div>
                                <div class="text-base font-bold text-indigo-600 dark:text-indigo-400">4 Departments</div>
                            </div>
                            <div class="p-3 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800 text-center">
                                <div class="text-[10px] text-slate-400">Total Workforce</div>
                                <div class="text-base font-bold text-emerald-600 dark:text-emerald-400">142 Workers</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (user.role === 'Worker') {
                content.innerHTML = `
                    <div class="p-4 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800 space-y-3">
                        <div class="font-bold text-slate-900 dark:text-white">👷 Worker Performance & Task Queue</div>
                        <div class="grid grid-cols-3 gap-2 text-center">
                            <div class="p-2.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800">
                                <div class="text-[10px] text-slate-400">Attendance</div>
                                <div class="font-bold text-emerald-500 mt-0.5">Present</div>
                            </div>
                            <div class="p-2.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800">
                                <div class="text-[10px] text-slate-400">Efficiency</div>
                                <div class="font-bold text-indigo-500 mt-0.5">94.2%</div>
                            </div>
                            <div class="p-2.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800">
                                <div class="text-[10px] text-slate-400">Tasks</div>
                                <div class="font-bold text-slate-900 dark:text-white mt-0.5">18/20</div>
                            </div>
                        </div>
                        <div class="p-3 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800 flex justify-between items-center">
                            <span>Batch #402 - Stamping Line</span>
                            <span class="bg-emerald-50 dark:bg-emerald-950 text-emerald-600 px-2 py-0.5 rounded text-[10px]">In Progress</span>
                        </div>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="p-4 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800 space-y-2">
                        <div class="font-bold text-slate-900 dark:text-white">⚙️ ${user.role} Operational Console</div>
                        <p class="text-slate-500">Supervising floor schedules, shift handovers, and task allocations for ${user.department}.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
